stages:
  - test
  - build

cache:
  paths:
    - node_modules/

lint-and-test:
  stage: test
  image: node:22-alpine
  script:
    - npm ci
    - npm run lint
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour

docker-build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
    - docker build -t $DOCKERHUB_USERNAME/avia-search:gitlab-latest .
    - docker push $DOCKERHUB_USERNAME/avia-search:gitlab-latest
  only:
    - main
