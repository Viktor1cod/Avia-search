apiVersion: apps/v1
kind: Deployment
metadata:
  name: avia-search
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: avia-search
  template:
    metadata:
      labels:
        app: avia-search
    spec:
      containers:
      - name: avia-search
        image: viktor1cod/avia-search:413972129a0f55edf2ba0f2bd679654157a5ddb4
        ports:
        - containerPort: 80
