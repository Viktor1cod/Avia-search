apiVersion: apps/v1
kind: Deployment
metadata:
  name: avia-search
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: avia-search
  template:
    metadata:
      labels:
        app: avia-search
    spec:
      containers:
      - name: avia-search
        image: viktor1cod/avia-search:df4469785e62a12e2b29e5fb5ed5ad6381ac6bc8
        ports:
        - containerPort: 80
